apiVersion: karpenter.k8s.aws/v1
kind: EC2NodeClass
metadata:
  name: monitoring-elk
spec:
  role: KarpenterNodeRole-cluster-prd
  amiSelectorTerms:
    - alias: al2023@latest
  subnetSelectorTerms:
    - tags:
        karpenter.sh/discovery: cluster-prd
  securityGroupSelectorTerms:
    - tags:
        karpenter.sh/discovery: cluster-prd
  blockDeviceMappings:
    - deviceName: /dev/xvda
      ebs:
        volumeSize: 30Gi
        volumeType: gp3
        encrypted: true
        deleteOnTermination: true
  tags:
    Name: prd-monitoring-v1
    monitoring: "true"
---
apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: monitoring-elk
spec:
  limits:
    cpu: 10
    memory: 40Gi
  template:
    metadata:
      labels:
        monitoring: "true"     # cria o label no nó
    spec:
      taints:
        - key: monitoring
          value: "true"
          effect: NoSchedule
      requirements:
        - key: kubernetes.io/arch
          operator: In
          values: ["amd64"]
        - key: kubernetes.io/os
          operator: In
          values: ["linux"]
        - key: karpenter.sh/capacity-type
          operator: In
          values: ["spot"]
        - key: karpenter.k8s.aws/instance-category
          operator: In
          values: ["t","c","m"]
      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: monitoring-elk
  disruption:
    consolidationPolicy: WhenEmptyOrUnderutilized
    consolidateAfter: 1m   # ajuste se quiser
